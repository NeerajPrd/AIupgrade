name: ci

# Runs on every PR and on main. Publishes NOTHING. These jobs are the required
# status checks that block a PR which would break lite mode or the architecture.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test

  lite-boot:
    # Deliberately installs WITHOUT the `full` extra. If any non-backend module
    # imports redis/celery, this fails at import time - a dependency-level proof
    # that lite mode is self-contained.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev          # no --extra full
      - run: uv run pytest tests/test_lite_boot.py -q
        env:
          DATABASE_URL_DEFAULT: postgresql+asyncpg://test:test@localhost:5432/test

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --dev
      - run: uv run lint-imports

  frontend:
    # Same build the Docker image runs (deploy/Dockerfile), so a PR that would
    # break the image build fails here instead of on the publish to main.
    # No separate type-check: next.config.mjs sets typescript.ignoreBuildErrors.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:8000/ws-api
      NEXT_PUBLIC_DISABLE_AUTH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
