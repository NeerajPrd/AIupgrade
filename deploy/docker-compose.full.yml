services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # NEXT_PUBLIC_* vars are baked into the Next.js client bundle at build
      # time, so they must be passed here (not just under `environment:`
      # below, which only affects the running container after the bundle
      # already exists).
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_BASE_URL}}
        NEXT_PUBLIC_WEBSOCKET_URL: ${NEXT_PUBLIC_WEBSOCKET_URL}
    restart: unless-stopped
    ports:
      - "8003:8000"
      - "3001:3000"
    environment:
      LITE_MODE: "false"
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      WEB_CONCURRENCY: "2"
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:-}"
      EVOLUTION_API_URL: "http://evolution-api:8080"
      WEBHOOK_URL: ${WEBHOOK_URL}
      PORT: "8000"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama-disabled.local:11434}"
    volumes:
      - fagoon_data:/data
    depends_on:
      evolution-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8000))\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 300s

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: uv run celery -A src.core.task_processing.celery_app worker -P eventlet -c 50
    environment:
      LITE_MODE: "false"
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama-disabled.local:11434}"
    volumes:
      - fagoon_data:/data
    depends_on:
      app:
        condition: service_healthy

  # ---- WhatsApp Gateway (Evolution API) — kept local (has its own db/redis) ----
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.2
    container_name: evolution_api_container_full
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - WPP_LID_MODE=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:secretpassword@evolution-db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - WEBSOCKET_ENABLED=false
      - RABBITMQ_ENABLED=false
      - SQS_ENABLED=false
    volumes:
      - evolution_instances:/Evolution/instances
    depends_on:
      - evolution-db
      - evolution-redis
    restart: unless-stopped

  evolution-db:
    image: postgres:15-alpine
    container_name: evolution_api_db_full
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  evolution-redis:
    image: redis:alpine
    container_name: evolution_api_redis_full
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data

volumes:
  fagoon_data:
  evolution_instances:
  evolution_db_data:
  evolution_redis_data:
