services:
  # ----------------------------------------
  # 1. YOUR FASTAPI BACKEND
  # ----------------------------------------
  upgrade-fagoon-dev:
    build: .
    image: upgrade-fagoon:dev
    container_name: upgrade-fagoon_dev_container
    ports:
      - "8004:2321"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=development
    restart: unless-stopped
    depends_on:
      - evolution-api

  # ----------------------------------------
  # 1b. THE NEXT.JS FRONTEND
  # ----------------------------------------
  upgrade-fagoon-frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing: the browser runs on the host, so it must use the
        # host-published backend port, not the internal container port.
        NEXT_PUBLIC_API_URL: http://localhost:8004
        NEXT_PUBLIC_BASE_URL: http://localhost:8004
        NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:8004/ws-api
    image: upgrade-fagoon-frontend:dev
    container_name: upgrade-fagoon_frontend_container
    ports:
      - "3000:8080"
    environment:
      # Server-only: the Next.js server itself runs inside this container, so it
      # reaches the backend via the Compose network, not the host-published port.
      - BACKEND_URL=http://upgrade-fagoon-dev:2321
    restart: unless-stopped
    depends_on:
      - upgrade-fagoon-dev

  # ----------------------------------------
  # 2. THE WHATSAPP GATEWAY (EVOLUTION API)
  # ----------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.2
    container_name: evolution_api_container
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - WPP_LID_MODE=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:secretpassword@evolution-db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - WEBSOCKET_ENABLED=false
      - RABBITMQ_ENABLED=false
      - SQS_ENABLED=false
    volumes:
      - evolution_instances:/Evolution/instances
    depends_on:
      - evolution-db
    restart: unless-stopped

  evolution-db:
    image: postgres:15-alpine
    container_name: evolution_api_db
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  evolution-redis:
    image: redis:alpine
    container_name: evolution_api_redis
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data

volumes:
  evolution_instances:
  evolution_db_data:
  evolution_redis_data: