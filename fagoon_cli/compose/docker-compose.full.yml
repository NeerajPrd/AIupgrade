services:
  app:
    image: ghcr.io/neerajprd/aiupgrade:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "3000:3000"
    environment:
      LITE_MODE: "false"
      DATA_DIR: /data
      DATABASE_URL: postgresql+asyncpg://fagoon:fagoon@db:5432/fagoon
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      WEB_CONCURRENCY: "2"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:-}"
      EVOLUTION_API_URL: "http://evolution-api:8080"
      WEBHOOK_URL: "${WEBHOOK_URL:-http://app:8000}"
      # Required in full mode - src/core/settings.py refuses to boot without
      # real values here (see the secret-enforcement check). Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      ENV: "${ENV:-production}"
      SECRET_KEY: "${SECRET_KEY}"
      JWT_SECRET: "${JWT_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      # Your public domain(s) - required for CORS and for auth cookies to be
      # set correctly once ENV=production (see COOKIE_DOMAIN_1 below).
      FRONTEND_HOST: "${FRONTEND_HOST:-*}"
      NEXT_PUBLIC_BASE_URL: "${NEXT_PUBLIC_BASE_URL:-http://localhost:8000}"
      COOKIE_DOMAIN_1: "${COOKIE_DOMAIN_1:-}"
      # Comma-separated list, e.g. https://yourdomain.com,https://app.yourdomain.com
      ALLOWED_CORS_ORIGIN: "${ALLOWED_CORS_ORIGIN:-http://localhost:3000,http://localhost:8000}"
    volumes:
      - ${FAGOON_DATA_DIR:-~/.fagoon}:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      evolution-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/openapi.json || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/neerajprd/aiupgrade:latest
    command: uv run celery -A src.core.task_processing.celery_app worker -P eventlet -c 50
    environment:
      LITE_MODE: "false"
      DATA_DIR: /data
      DATABASE_URL: postgresql+asyncpg://fagoon:fagoon@db:5432/fagoon
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      ENV: "${ENV:-production}"
      SECRET_KEY: "${SECRET_KEY}"
      JWT_SECRET: "${JWT_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
    volumes:
      - ${FAGOON_DATA_DIR:-~/.fagoon}:/data
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  # ---- WhatsApp Gateway (Evolution API) ----
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.2
    environment:
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - WPP_LID_MODE=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:secretpassword@evolution-db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - WEBSOCKET_ENABLED=false
      - RABBITMQ_ENABLED=false
      - SQS_ENABLED=false
    volumes:
      - evolution_instances:/Evolution/instances
    depends_on:
      - evolution-db
      - evolution-redis
    restart: unless-stopped

  evolution-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  evolution-redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fagoon
      POSTGRES_PASSWORD: fagoon
      POSTGRES_DB: fagoon
    volumes:
      - fagoon_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fagoon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fagoon_data:
  fagoon_db:
  evolution_instances:
  evolution_db_data:
  evolution_redis_data:
