[project]
name = "fagoon-upgrade"
version = "2.0.5"
description = "Fagoon AI Agents Workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.13",
    "anthropic>=0.51.0",
    "bs4>=0.0.2",
    "elevenlabs>=1.53.0",
    "fastapi>=0.115.11",
    "google-cloud-storage>=3.1.0",
    "google-genai>=1.11.0",
    "gpt-researcher>=0.15.0",
    "groq>=0.18.0",
    "gunicorn>=23.0.0",
    "huggingface-hub>=0.29.2",
    "kokoro-onnx>=0.4.5",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "nanoid>=2.0.0",
    "openai>=1.65.2",
    "passlib>=1.7.4",
    "pillow>=11.1.0",
    "pydantic-settings>=2.8.1",
    "pypdf>=5.4.0",
    "python-docx>=1.2.0",
    "python-jose>=3.4.0",
    "python-multipart>=0.0.20",
    "soundfile>=0.13.1",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
    "google-api-python-client>=2.171.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "pydantic[email]>=2.11.5",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.28.1",
    "celery[eventlet,redis]>=5.5.3",
    "eventlet>=0.40.0",
    "ffmpeg-python>=0.2.0",
    "google-genai>=1.19.0",
    "google-generativeai>=0.8.5",
    "kombu>=5.5.4",
    "aiosmtplib>=4.0.1",
    "bcrypt>=4.3.0",
    "pydantic-core>=2.33.2",
    "pyjwt>=2.10.1",
    "rembg>=2.0.66",
    "llvmlite>=0.44.0",
    "numba>=0.61.2",
    "google-search-results>=2.4.2",
    "crawl4ai>=0.7.2",
    "fal-client>=0.7.0",
    "pymupdf>=1.26.1",
    "pdfplumber>=0.11.7",
    "rank-bm25>=0.2.2",
    "loguru>=0.7.3",
    "sqlalchemy>=2.0.38",
    "asyncpg>=0.30.0",
    "alembic>=1.14.1",
    "pgvector>=0.3.6",
    "bson>=0.5.10",
    "ddgs>=9.14.4",
    "vertexai>=1.43.0",
    "cryptography>=48.0.0",
    "typer>=0.12.0",
    "sqlmodel>=0.0.38",
    "croniter>=6.0.0",
    "fakeredis>=2.0.0",
    "sortedcontainers>=2.4.0",
    "argon2-cffi>=23.1.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
    "factory-boy>=3.3.0",
]

[project.optional-dependencies]
full = ["celery[redis]", "redis", "eventlet"]   # only needed in full mode
dev  = ["pytest", "pytest-asyncio", "import-linter", "ruff"]

[project.scripts]
fagoon = "fagoon_cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "fagoon_cli"]
