<!doctype html>
<html>
<head><meta charset="utf-8"><title>widget case</title></head>
<body>
<script>
/*
 * One widget test case per page load: ?case=<name>. Mocks fetch / storage, injects
 * the real frontend/public/widget.js with the case's data attributes, runs the
 * checks against the widget's shadow DOM, and posts results to the parent harness.
 */
(function () {
  var params = new URLSearchParams(location.search);
  var caseName = params.get("case");
  var ENDPOINT = "https://api.test/api/v1/agent-api/demo/chat";
  var KEY = "spirit-monkey-widget:conversation:" + ENDPOINT;
  var LEGACY_KEY = "fagoon-widget:conversation:" + ENDPOINT;
  var DAY = 24 * 60 * 60 * 1000;
  var requests = [];
  var responses = [];
  var results = [];

  function check(name, ok, info) { results.push({ name: name, ok: !!ok, info: info === undefined ? "" : String(info) }); }
  function done() { parent.postMessage({ case: caseName, results: results }, "*"); }
  function tick(ms) { return new Promise(function (r) { setTimeout(r, ms || 30); }); }

  window.fetch = function (url, opts) {
    requests.push({ url: url, body: JSON.parse(opts.body), headers: opts.headers });
    var next = responses.shift() || { status: 200, body: { success: true, conversation_id: "conv-1", response: "ok" } };
    return Promise.resolve(new Response(JSON.stringify(next.body), { status: next.status, headers: { "Content-Type": "application/json" } }));
  };

  function inject(attrs) {
    var s = document.createElement("script");
    s.src = params.get("widget") || "/frontend/public/widget.js"; // ?widget= lets you test another build
    s.setAttribute("data-endpoint", ENDPOINT);
    s.setAttribute("data-api-key", "agapi_test");
    s.setAttribute("data-agent-name", "Demo");
    Object.keys(attrs || {}).forEach(function (k) { s.setAttribute(k, attrs[k]); });
    return new Promise(function (resolve) { s.onload = function () { tick().then(resolve); }; document.body.appendChild(s); });
  }

  function root() { return document.getElementById("spirit-monkey-widget-host").shadowRoot; }
  function q(sel) { return root().querySelector(sel); }
  function open() { q(".fw-bubble").click(); }
  function messages() { return Array.prototype.slice.call(root().querySelectorAll(".fw-msg")); }
  function lastMessage() { var m = messages(); return m[m.length - 1]; }
  function send(text) { q(".fw-input").value = text; q(".fw-send").click(); return tick(60); }
  function headerBg() { return getComputedStyle(q(".fw-header")).backgroundColor; }
  function stored() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return "ERR"; } }

  // Image-launcher cases: no network and no image files. The widget still sets the
  // https URL; we record it and load a transparent PNG drawn on a canvas instead
  // (or deliberately broken data for the fallback case).
  var LAUNCHER_URL = "https://cdn.example.com/launcher.png";
  var BROKEN_IMAGE = "data:image/png;base64,bm90IGFuIGltYWdl";
  var requestedImages = [];
  function generatedLauncherPng() {
    var c = document.createElement("canvas");
    c.width = 130; c.height = 160; // transparent background
    var g = c.getContext("2d");
    g.fillStyle = "#0a7"; g.beginPath(); g.arc(65, 70, 50, 0, Math.PI * 2); g.fill();
    g.fillRect(40, 120, 50, 30);
    return c.toDataURL("image/png");
  }
  function interceptImages(replacement, url) {
    url = url || LAUNCHER_URL;
    var desc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
    Object.defineProperty(HTMLImageElement.prototype, "src", {
      configurable: true,
      get: function () { return desc.get.call(this); },
      set: function (v) {
        requestedImages.push(v);
        desc.set.call(this, v === url ? replacement : v);
      },
    });
  }
  function bubbleStyle() { return getComputedStyle(q(".fw-bubble")); }
  function width(attr) {
    interceptImages(generatedLauncherPng());
    var attrs = { "data-launcher-image-url": LAUNCHER_URL };
    if (attr !== undefined) attrs["data-launcher-width"] = attr;
    return inject(attrs).then(function () { return tick(120); }).then(function () { return bubbleStyle().width; });
  }

  var cases = {
    defaults: function () {
      return inject({}).then(function () {
        open();
        check("default colour", headerBg() === "rgb(79, 70, 229)", headerBg());
        check("no logo", !q(".fw-logo"));
        check("default welcome", messages()[0].textContent === "Hi! How can I help you today?", messages()[0].textContent);
      });
    },
    brand_and_logo: function () {
      interceptImages(generatedLauncherPng(), "https://example.com/logo.png"); // no network: logo must stay rendered
      return inject({ "data-brand-color": "#0a7", "data-logo-url": "https://example.com/logo.png", "data-welcome-message": "Namaste! Ask us about Nepalland." }).then(function () {
        open();
        check("brand colour applied", headerBg() === "rgb(0, 170, 119)", headerBg());
        var img = q(".fw-logo");
        check("logo rendered", img && requestedImages.indexOf("https://example.com/logo.png") !== -1, img && requestedImages.join(","));
        check("logo alt empty", img && img.alt === "");
        check("custom welcome", messages()[0].textContent === "Namaste! Ask us about Nepalland.");
      });
    },
    legacy_primary_color: function () {
      return inject({ "data-primary-color": "#ff0000" }).then(function () {
        open();
        check("legacy data-primary-color still works", headerBg() === "rgb(255, 0, 0)", headerBg());
      });
    },
    brand_beats_primary: function () {
      return inject({ "data-primary-color": "#ff0000", "data-brand-color": "#00ff00" }).then(function () {
        open();
        check("data-brand-color wins", headerBg() === "rgb(0, 255, 0)", headerBg());
      });
    },
    invalid_color_injection: function () {
      return inject({ "data-brand-color": "red;}:host{display:none}", "data-primary-color": "indigo" }).then(function () {
        open();
        check("falls back to default", headerBg() === "rgb(79, 70, 229)", headerBg());
        check("payload not in CSS", root().querySelector("style").textContent.indexOf("display:none}") === -1);
      });
    },
    http_logo_rejected: function () {
      return inject({ "data-logo-url": "http://example.com/logo.png" }).then(function () {
        check("http logo ignored", !q(".fw-logo"));
      });
    },
    javascript_logo_rejected: function () {
      return inject({ "data-logo-url": "javascript:alert(1)" }).then(function () {
        check("javascript: logo ignored", !q(".fw-logo"));
      });
    },
    welcome_is_plain_text: function () {
      var payload = '<img src=x onerror="window.__pwned=1"> **bold**';
      return inject({ "data-welcome-message": payload }).then(function () {
        open();
        return tick(80);
      }).then(function () {
        var m = messages()[0];
        check("text shown literally", m.textContent === payload, m.textContent);
        check("no element injected", m.children.length === 0, m.innerHTML);
        check("no script ran", !window.__pwned);
      });
    },
    welcome_truncated: function () {
      var long = new Array(401).join("a");
      return inject({ "data-welcome-message": long }).then(function () {
        open();
        var t = messages()[0].textContent;
        check("truncated to 300", t.length === 300, t.length);
        check("ends with ellipsis", t.slice(-1) === "…");
      });
    },
    cap_reached_message: function () {
      responses.push({ status: 402, body: { detail: { code: "chat_cap_reached", message: "limit" } } });
      return inject({}).then(function () {
        open();
        return send("hello");
      }).then(function () {
        check("friendly cap message", lastMessage().textContent === "Our assistant is unavailable right now, please contact us directly.", lastMessage().textContent);
        check("shown as error", lastMessage().classList.contains("fw-msg-error"));
        check("nothing stored", stored() === null);
      });
    },
    rate_limit_unchanged: function () {
      responses.push({ status: 429, body: { detail: "Rate limit exceeded." } });
      return inject({}).then(function () { open(); return send("hello"); }).then(function () {
        check("429 message unchanged", lastMessage().textContent.indexOf("too fast") !== -1, lastMessage().textContent);
      });
    },
    conversation_saved: function () {
      localStorage.removeItem(KEY);
      var before = Date.now();
      return inject({}).then(function () { open(); return send("hello"); }).then(function () {
        var s = stored();
        check("first request has no conversation_id", !("conversation_id" in requests[0].body));
        check("id saved", s && s.id === "conv-1", JSON.stringify(s));
        check("expires in ~24h", s && s.expiresAt >= before + DAY && s.expiresAt <= Date.now() + DAY, s && s.expiresAt - before);
        return send("again");
      }).then(function () {
        check("follow-up sends id", requests[1].body.conversation_id === "conv-1");
      });
    },
    conversation_restored_after_reload: function () {
      localStorage.setItem(KEY, JSON.stringify({ id: "conv-old", expiresAt: Date.now() + 60000 }));
      responses.push({ status: 200, body: { success: true, conversation_id: "conv-old", response: "welcome back" } });
      return inject({}).then(function () { open(); return send("hi again"); }).then(function () {
        check("restored id sent", requests[0].body.conversation_id === "conv-old", JSON.stringify(requests[0].body));
        var s = stored();
        check("expiry not extended", s && s.expiresAt <= Date.now() + 60000, s && s.expiresAt);
      });
    },
    expired_conversation_dropped: function () {
      localStorage.setItem(KEY, JSON.stringify({ id: "conv-stale", expiresAt: Date.now() - 1 }));
      return inject({}).then(function () {
        check("stale entry removed", stored() === null || (stored() && stored().id !== "conv-stale"));
        open();
        return send("hi");
      }).then(function () {
        check("no stale id sent", !("conversation_id" in requests[0].body), JSON.stringify(requests[0].body));
      });
    },
    corrupt_storage_ignored: function () {
      localStorage.setItem(KEY, "{not json");
      return inject({}).then(function () { open(); return send("hi"); }).then(function () {
        check("works with corrupt entry", !("conversation_id" in requests[0].body));
        check("reply shown", lastMessage().textContent === "ok");
      });
    },
    conversation_not_found_resets: function () {
      localStorage.setItem(KEY, JSON.stringify({ id: "conv-gone", expiresAt: Date.now() + 60000 }));
      responses.push({ status: 404, body: { detail: { code: "conversation_not_found", message: "x" } } });
      return inject({}).then(function () { open(); return send("hi"); }).then(function () {
        check("expired message", lastMessage().textContent.indexOf("conversation has expired") !== -1, lastMessage().textContent);
        check("storage cleared", stored() === null);
        return send("hi again");
      }).then(function () {
        check("next send starts fresh", !("conversation_id" in requests[1].body), JSON.stringify(requests[1].body));
      });
    },
    launcher_not_set: function () {
      return inject({}).then(function () {
        var b = q(".fw-bubble");
        check("round icon launcher", b.querySelector("svg") && !b.querySelector("img"));
        check("no image class", !b.classList.contains("fw-launcher-image"));
        check("60px circle", bubbleStyle().width === "60px" && bubbleStyle().borderRadius === "50%", bubbleStyle().width + " " + bubbleStyle().borderRadius);
        check("no launcher-image CSS added", root().querySelector("style").textContent.indexOf("fw-launcher-image") === -1);
        open();
        check("panel at the usual 74px", getComputedStyle(q(".fw-panel")).bottom === "74px" && q(".fw-panel").style.bottom === "", getComputedStyle(q(".fw-panel")).bottom);
      });
    },
    launcher_image: function () {
      interceptImages(generatedLauncherPng());
      return inject({ "data-launcher-image-url": LAUNCHER_URL }).then(function () { return tick(120); }).then(function () {
        var b = q(".fw-bubble");
        var img = b.querySelector("img");
        var st = bubbleStyle();
        check("still a <button type=button>", b.tagName === "BUTTON" && b.type === "button");
        check("image shown, icon removed", img && !b.querySelector("svg"));
        check("requested the https URL", requestedImages.indexOf(LAUNCHER_URL) !== -1, requestedImages.join(","));
        check("image loaded", img && img.complete && img.naturalWidth === 130, img && img.naturalWidth);
        check("alt text is agent name", img && img.alt === "Demo", img && img.alt);
        check("aria-label Open chat", b.getAttribute("aria-label") === "Open chat");
        check("default width 130px", st.width === "130px", st.width);
        check("no circle crop", st.borderRadius === "0px", st.borderRadius);
        check("no background", st.backgroundColor === "rgba(0, 0, 0, 0)", st.backgroundColor);
        check("no box shadow", st.boxShadow === "none", st.boxShadow);
        check("bottom-right position", getComputedStyle(q(".fw-root")).right === "20px" && getComputedStyle(q(".fw-root")).bottom === "20px");
        b.focus();
        check("keyboard focusable", root().activeElement === b && b.tabIndex === 0);

        b.click();
        var panel = q(".fw-panel");
        check("click opens chat", panel.classList.contains("fw-open"));
        check("aria-label becomes Close chat", b.getAttribute("aria-label") === "Close chat");
        check("welcome message shown", messages().length === 1 && messages()[0].textContent === "Hi! How can I help you today?");
        check("input focused on open", root().activeElement === q(".fw-input"));
        var pr = panel.getBoundingClientRect(), br = b.getBoundingClientRect();
        check("chat window sits above the image", pr.bottom <= br.top + 0.5, "panel bottom " + pr.bottom + " / image top " + br.top);
        b.click();
        check("click closes chat", !panel.classList.contains("fw-open") && b.getAttribute("aria-label") === "Open chat");
      });
    },
    launcher_hover_and_reduced_motion: function () {
      interceptImages(generatedLauncherPng());
      return inject({ "data-launcher-image-url": LAUNCHER_URL }).then(function () {
        var css = root().querySelector("style").textContent;
        check("gentle hover", css.indexOf(".fw-bubble.fw-launcher-image:hover{transform:scale(1.04)}") !== -1);
        check("hover off for reduced motion", /@media \(prefers-reduced-motion:reduce\)\{[^@]*fw-launcher-image\{transition:none\}[^@]*:hover\{transform:none\}/.test(css));
        check("visible focus ring", css.indexOf(".fw-bubble.fw-launcher-image:focus-visible{outline:2px solid") !== -1);
      });
    },
    launcher_width_clamp_high: function () {
      return width("500").then(function (w) { check("500 clamped to 200px", w === "200px", w); });
    },
    launcher_width_clamp_low: function () {
      return width("20").then(function (w) { check("20 clamped to 80px", w === "80px", w); });
    },
    launcher_width_px_suffix: function () {
      return width("150px").then(function (w) { check("150px accepted", w === "150px", w); });
    },
    launcher_width_invalid: function () {
      return width("big;}*{display:none").then(function (w) { check("invalid falls back to 130px", w === "130px", w); });
    },
    launcher_phone_width: function () {
      return width("200").then(function (w) {
        check("precondition: narrow viewport", window.innerWidth <= 480, window.innerWidth);
        check("capped at 130px on phones", w === "130px", w);
      });
    },
    launcher_phone_width_small: function () {
      return width("100").then(function (w) {
        check("precondition: narrow viewport", window.innerWidth <= 480, window.innerWidth);
        check("widths under the cap unchanged on phones", w === "100px", w);
      });
    },
    launcher_fallback_on_error: function () {
      interceptImages(BROKEN_IMAGE);
      return inject({ "data-launcher-image-url": LAUNCHER_URL }).then(function () { return tick(150); }).then(function () {
        var b = q(".fw-bubble");
        check("requested the https URL", requestedImages.indexOf(LAUNCHER_URL) !== -1);
        check("falls back to icon", b.querySelector("svg") && !b.querySelector("img"));
        check("image class removed", !b.classList.contains("fw-launcher-image"));
        check("normal 60px circle", bubbleStyle().width === "60px" && bubbleStyle().borderRadius === "50%", bubbleStyle().width + " " + bubbleStyle().borderRadius);
        check("aria-label Open chat", b.getAttribute("aria-label") === "Open chat");
        b.click();
        check("chat still opens", q(".fw-panel").classList.contains("fw-open"));
        check("panel back at 74px", getComputedStyle(q(".fw-panel")).bottom === "74px", getComputedStyle(q(".fw-panel")).bottom);
      });
    },
    launcher_http_rejected: function () {
      interceptImages(generatedLauncherPng());
      return inject({ "data-launcher-image-url": "http://cdn.example.com/launcher.png" }).then(function () {
        var b = q(".fw-bubble");
        check("http image ignored", b.querySelector("svg") && !b.querySelector("img") && !b.classList.contains("fw-launcher-image"));
        check("nothing requested", requestedImages.length === 0, requestedImages.join(","));
      });
    },
    legacy_storage_key_still_restores: function () {
      localStorage.setItem(LEGACY_KEY, JSON.stringify({ id: "conv-legacy", expiresAt: Date.now() + 60000 }));
      return inject({}).then(function () { open(); return send("hi"); }).then(function () {
        check("legacy id sent", requests[0].body.conversation_id === "conv-legacy", JSON.stringify(requests[0].body));
        localStorage.removeItem(LEGACY_KEY);
      });
    },
    quick_replies_shown_and_send: function () {
      return inject({ "data-quick-replies": "Pricing| Free trial |<b>Talk</b> to a human|Pricing||Four|Five" }).then(function () {
        open();
        var chips = Array.prototype.slice.call(root().querySelectorAll(".fw-chip"));
        var labels = chips.map(function (c) { return c.textContent; });
        check("max 4 chips, trimmed, no duplicates or blanks", labels.join("/") === "Pricing/Free trial/<b>Talk</b> to a human/Four", labels.join("/"));
        check("chip text is never HTML", !root().querySelector(".fw-chip b"));
        check("chips sit after the welcome message", q(".fw-chips").previousElementSibling === messages()[0]);
        chips[1].click();
        return tick(60);
      }).then(function () {
        check("clicking a chip sends it", requests.length === 1 && requests[0].body.message === "Free trial", JSON.stringify(requests[0] && requests[0].body));
        check("chips removed after first message", !q(".fw-chips"));
        check("visitor bubble shows the chip text", messages()[1].textContent === "Free trial");
      });
    },
    quick_replies_absent_by_default: function () {
      return inject({}).then(function () {
        open();
        check("no chips without the attribute", !q(".fw-chips"));
      });
    },
    quick_replies_removed_when_typing: function () {
      return inject({ "data-quick-replies": "Pricing|Free trial" }).then(function () { open(); return send("hello"); }).then(function () {
        check("chips removed after a typed message", !q(".fw-chips"));
      });
    },
    whatsapp_button_hidden_until_number_arrives: function () {
      return inject({}).then(function () {
        open();
        check("hidden at first", getComputedStyle(q(".fw-handoff")).display === "none");
        return send("hello");
      }).then(function () {
        check("still hidden when the reply has no number", getComputedStyle(q(".fw-handoff")).display === "none");
      });
    },
    whatsapp_button_prefills_question: function () {
      responses.push({ status: 200, body: { success: true, conversation_id: "conv-1", response: "ok", handoff: { whatsapp: "9779841234567" } } });
      return inject({}).then(function () { open(); return send("fee kati ho? & can I pay by eSewa"); }).then(function () {
        var link = q(".fw-whatsapp");
        check("button visible", getComputedStyle(q(".fw-handoff")).display === "block");
        check("label", link.textContent === "Chat on WhatsApp", link.textContent);
        var url = new URL(link.href);
        check("opens wa.me with the number", url.origin + url.pathname === "https://wa.me/9779841234567", link.href);
        var text = url.searchParams.get("text");
        check("question pre-filled", text === "Hi, I was chatting with Demo on your website. My question: fee kati ho? & can I pay by eSewa", text);
        check("opens in a new tab safely", link.target === "_blank" && /noopener/.test(link.rel));
      });
    },
    whatsapp_bad_number_ignored: function () {
      responses.push({ status: 200, body: { success: true, conversation_id: "conv-1", response: "ok", handoff: { whatsapp: "javascript:alert(1)" } } });
      return inject({}).then(function () { open(); return send("hi"); }).then(function () {
        check("no button for a non-number", getComputedStyle(q(".fw-handoff")).display === "none");
        check("no href set", !q(".fw-whatsapp").getAttribute("href"));
      });
    },
    typing_indicator_while_waiting: function () {
      var release;
      var realFetch = window.fetch;
      window.fetch = function (url, opts) {
        return new Promise(function (resolve) { release = function () { resolve(realFetch(url, opts)); }; });
      };
      return inject({}).then(function () {
        open();
        q(".fw-input").value = "hello";
        q(".fw-send").click();
        return tick(30);
      }).then(function () {
        var typing = q(".fw-msg-typing");
        check("typing dots shown while waiting", typing && typing.querySelectorAll(".fw-dot").length === 3);
        check("typing indicator is announced", typing && typing.getAttribute("aria-label") === "Demo is typing");
        check("input disabled while waiting", q(".fw-input").disabled && q(".fw-send").disabled);
        release();
        return tick(80);
      }).then(function () {
        check("typing dots removed after the reply", !q(".fw-msg-typing"));
        check("reply shown", lastMessage().textContent === "ok");
        check("input enabled again", !q(".fw-input").disabled);
      });
    },
    reply_formatting_is_safe: function () {
      var reply = [
        "**Plans** are <b>simple</b> <img src=x onerror=alert(1)>",
        "- Standard",
        "- Growth",
        "1. First",
        "See www.skillsquare.com.np. Or [our site](https://spirit-monkey.com/pricing?a=1&b=2), also https://example.com/x).",
        // Split so this page's own script block isn't closed by the test data.
        "[bad](javascript:alert(1)) and <scr" + "ipt>alert(2)</scr" + "ipt>",
        "### Heading",
      ].join("\n");
      responses.push({ status: 200, body: { success: true, conversation_id: "conv-1", response: reply } });
      return inject({}).then(function () { open(); return send("hi"); }).then(function () {
        var m = lastMessage();
        var links = Array.prototype.slice.call(m.querySelectorAll("a"));
        var hrefs = links.map(function (a) { return a.getAttribute("href"); });
        check("bold rendered", m.querySelector("strong") && m.querySelector("strong").textContent === "Plans");
        check("bullet list rendered", m.querySelectorAll("ul li").length === 2);
        check("numbered list rendered", m.querySelectorAll("ol li").length === 1);
        check("raw HTML stays text", !m.querySelector("b") && !m.querySelector("img") && !m.querySelector("script"));
        check("three links", hrefs.length === 3, hrefs.join(" | "));
        check("www link gets https and drops the full stop", hrefs[0] === "https://www.skillsquare.com.np", hrefs[0]);
        check("markdown link keeps its label and query", links[1] && links[1].textContent === "our site" && hrefs[1] === "https://spirit-monkey.com/pricing?a=1&b=2", hrefs[1]);
        check("bare link drops trailing punctuation", hrefs[2] === "https://example.com/x", hrefs[2]);
        check("only http(s) links", hrefs.every(function (h) { return /^https:\/\//.test(h); }), hrefs.join(" | "));
        check("javascript: link stays plain text", m.textContent.indexOf("[bad](javascript:alert(1))") !== -1);
        check("links open in a new tab safely", links.every(function (a) { return a.target === "_blank" && /noopener/.test(a.rel); }));
        check("heading shown bold without hashes", m.textContent.indexOf("###") === -1 && m.innerHTML.indexOf("<strong>Heading</strong>") !== -1);
      });
    },
    welcome_message_never_rendered_as_html: function () {
      return inject({ "data-welcome-message": "**Hi** <a href='https://x.com'>x</a> https://example.com" }).then(function () {
        open();
        check("welcome stays plain text", !messages()[0].querySelector("a") && !messages()[0].querySelector("strong"));
      });
    },
    phone_chat_fills_the_screen: function () {
      return inject({ "data-quick-replies": "Pricing" }).then(function () {
        open();
        var r = q(".fw-panel").getBoundingClientRect();
        check("panel spans the full width", Math.round(r.left) === 0 && Math.round(r.width) === window.innerWidth, r.left + " " + r.width + " vs " + window.innerWidth);
        check("panel spans the full height", Math.round(r.top) === 0 && Math.abs(r.height - window.innerHeight) <= 1, r.top + " " + r.height + " vs " + window.innerHeight);
        check("16px input (no iOS zoom)", getComputedStyle(q(".fw-input")).fontSize === "16px", getComputedStyle(q(".fw-input")).fontSize);
        check("close button reachable", q(".fw-close").getBoundingClientRect().right <= window.innerWidth);
        q(".fw-close").click();
        check("close button closes the chat", !q(".fw-panel").classList.contains("fw-open"));
        check("launcher visible again", q(".fw-bubble").getBoundingClientRect().width > 0);
      });
    },
    desktop_panel_unchanged: function () {
      return inject({}).then(function () {
        open();
        var st = getComputedStyle(q(".fw-panel"));
        check("340px floating panel on desktop", st.width === "340px" && st.position === "absolute", st.width + " " + st.position);
      });
    },
    storage_blocked: function () {
      var blocked = false;
      try {
        Object.defineProperty(window, "localStorage", { configurable: true, get: function () { throw new DOMException("blocked", "SecurityError"); } });
        try { window.localStorage; } catch (e) { blocked = true; }
      } catch (e) {}
      check("precondition: storage access throws", blocked);
      var errors = [];
      window.addEventListener("error", function (e) { errors.push(e.message); });
      return inject({}).then(function () { open(); return send("hi"); }).then(function () {
        check("reply shown", lastMessage().textContent === "ok", lastMessage().textContent);
        return send("again");
      }).then(function () {
        check("follow-up uses in-memory id", requests[1].body.conversation_id === "conv-1");
        check("no uncaught errors", errors.length === 0, errors.join("; "));
      });
    },
  };

  if (params.get("list")) { parent.postMessage({ list: Object.keys(cases) }, "*"); return; }
  if (!cases[caseName]) { check("unknown case", false, caseName); done(); return; }
  try { localStorage.removeItem(KEY); localStorage.removeItem(LEGACY_KEY); } catch (e) {}
  Promise.resolve().then(cases[caseName]).catch(function (e) { check("threw", false, e && e.stack || e); }).then(done);
})();
</script>
